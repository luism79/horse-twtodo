<main class="login-page">
  <section class="login-brand">
    <div class="brand-mark">
      <mat-icon matListItemIcon>list_alt_check</mat-icon>
    </div>

    <div class="brand-copy">
      <strong>Task</strong>
      <span>Organize o trabalho. Entregue melhor.</span>
    </div>
  </section>

  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Bem-vindo</mat-card-title>
      <mat-card-subtitle>Entre para acessar seu workspace</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input #email matInput type="email" formControlName="email" autocomplete="username">
          <mat-icon matSuffix>mail</mat-icon>
          <mat-error>Informe um e-mail válido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar senha' : 'Ocultar senha'"
          >
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error>A senha deve ter pelo menos {{ minLength }} caracteres.</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" class="submit-button" type="submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          }
          <span>{{ loading() ? 'Entrando...' : 'Entrar' }}</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
