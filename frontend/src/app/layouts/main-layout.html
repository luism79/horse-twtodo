<mat-sidenav-container class="shell">
  <mat-sidenav [mode]="'side'" [opened]="sidenavOpen" class="sidenav">
    <div class="brand"><mat-icon matListItemIcon>list_alt_check</mat-icon><span>Minhas Tarefas</span></div>
    <div class="nav-label">Workspace</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>space_dashboard</mat-icon><span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/tasks" routerLinkActive="active">
        <mat-icon matListItemIcon>checklist</mat-icon><span matListItemTitle>Tarefas</span>
      </a>
    </mat-nav-list>
    <div class="sidenav-footer">
      <button mat-stroked-button class="logout-button" (click)="logout()"><mat-icon>logout</mat-icon> Sair</button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <button mat-icon-button aria-label="Abrir menu" (click)="toggleSidenav()"><mat-icon>menu</mat-icon></button>
      <span class="topbar-title">Workspace</span>
      <span class="spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <span class="user-email">{{ authenticatedUser?.email }}</span><mat-icon>expand_more</mat-icon> 
      </button>
      <mat-menu #userMenu="matMenu" class="user-menu-panel">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <main class="page-content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
